name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.17
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project worker --locked
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and unit/protocol tests
        if: always() && !cancelled()
        run: npm run check
      - name: Legacy upstream browser
        if: always() && !cancelled()
        run: uv run --project worker --no-sync python worker/tests/browser_smoke.py
      - name: Public CLI lifecycle
        if: always() && !cancelled()
        run: node test/lifecycle.smoke.mjs
      - name: Managed upstream Jev and crash receipts
        if: always() && !cancelled()
        run: uv run --project worker --no-sync python worker/tests/managed_smoke.py
      - name: Scoped adapter and native MCP images
        if: always() && !cancelled()
        run: timeout 90s node test/adapter.smoke.mjs
      - name: Public workflows and real crash recovery
        if: always() && !cancelled()
        run: timeout 180s node test/workflows.smoke.mjs
      - name: Actual Midscene with controlled provider
        if: always() && !cancelled()
        run: timeout 90s node test/vision.smoke.mjs
      - name: Review regressions for retention and preflight
        if: always() && !cancelled()
        run: timeout 90s node test/review-followups.smoke.mjs
