name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.17
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project worker --locked
      - name: Typecheck and test CLI, MCP, and worker
        run: npm run check
      - name: Real Chrome smoke test, without model API calls
        if: ${{ !cancelled() }}
        run: uv run --project worker --no-sync python worker/tests/browser_smoke.py
