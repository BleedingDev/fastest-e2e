name: Validate review fixes
on:
  push:
    branches: [fix/pr-2-review-followups]
    paths: [.github/workflows/review-fixture.yml, .github/review-source.patch, test/**]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'BleedingDev/fastest-e2e' && github.ref == 'refs/heads/fix/pr-2-review-followups'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.17
          python-version: '3.12'
      - name: Apply reviewed source changes
        run: git apply --index .github/review-source.patch
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project worker --locked
      - name: Unit and protocol tests
        run: npm run check
      - name: Review regression browser suite
        run: timeout 90s node test/review-followups.smoke.mjs
      - name: Existing browser suites
        run: |
          uv run --project worker --no-sync python worker/tests/browser_smoke.py
          node test/lifecycle.smoke.mjs
          uv run --project worker --no-sync python worker/tests/managed_smoke.py
          npm run test:browser
      - name: Commit tested code and remove temporary runner
        run: |
          git rm .github/review-source.patch .github/workflows/review-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect recovery secrets and retry never-started preflight requests'
          git push origin HEAD:fix/pr-2-review-followups
