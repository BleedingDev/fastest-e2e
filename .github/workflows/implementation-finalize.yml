name: Final implementation validation
on:
  push:
    branches: [feat/run-recovery-and-vision]
    paths: [.github/workflows/implementation-finalize.yml]
permissions:
  contents: write
  actions: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/run-recovery-and-vision'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stop obsolete stalled validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/BleedingDev/fastest-e2e/actions/runs/35534823364/cancel || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.17
          python-version: '3.12'
      - name: Bound missing-frame and missing-control waits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/page-worker.ts'); s=p.read_text(); old='waitFor({ state: "attached" })'; assert s.count(old)==2
          p.write_text(s.replace(old,'waitFor({ state: "attached", timeout: 3_000 })'))
          Path('.github/workflows/implementation-finalize.yml').unlink()
          PY
      - name: Commit bounded waits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/page-worker.ts .github/workflows/implementation-finalize.yml
          git commit -m 'fix: bound unsupported frame and missing control waits'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/run-recovery-and-vision
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project worker --locked
      - name: Inspect runtime advisories
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node --input-type=module - <<'JS'
          import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));console.log(JSON.stringify({metadata:r.metadata,error:r.error,advisories:Object.values(r.vulnerabilities||{}).map(v=>({name:v.name,severity:v.severity,range:v.range,via:v.via,fix:v.fixAvailable}))},null,2));
          JS
      - name: Typecheck and unit tests
        run: npm run check
      - name: Managed upstream Jev
        if: ${{ !cancelled() }}
        run: uv run --project worker --no-sync python worker/tests/managed_smoke.py
      - name: Scoped adapter and native MCP images
        if: ${{ !cancelled() }}
        run: timeout 90s node test/adapter.smoke.mjs
      - name: Public workflows and real crashes
        if: ${{ !cancelled() }}
        run: timeout 180s node test/workflows.smoke.mjs
      - name: Real Midscene with controlled model responses
        if: ${{ !cancelled() }}
        run: timeout 90s node test/vision.smoke.mjs
