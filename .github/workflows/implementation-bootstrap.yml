name: Implementation bootstrap
on:
  push:
    branches: [feat/run-recovery-and-vision]
    paths: [.github/workflows/implementation-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.17
          python-version: '3.12'
      - name: Prepare source and adapter dependencies
        run: |
          npm ci --ignore-scripts
          npm install --save-exact --ignore-scripts playwright-core @midscene/web ajv ajv-formats
          uv sync --project worker --locked
          mkdir -p .bootstrap/upstream
          cp "$(command -v node)" .bootstrap/node
          uv run --project worker --no-sync python - <<'PY'
          import pathlib, shutil, jev_ultrafast, browser_harness
          for module in (jev_ultrafast, browser_harness):
              shutil.copytree(pathlib.Path(module.__file__).parent, pathlib.Path('.bootstrap/upstream') / module.__name__)
          PY
          npm list --depth=0
          tar --exclude=.git --exclude=worker/.venv -czf /tmp/implementation-workspace.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: implementation-workspace
          path: /tmp/implementation-workspace.tar.gz
          retention-days: 1
