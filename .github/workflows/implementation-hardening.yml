name: Recovery and dependency hardening
on:
  push:
    branches: [feat/run-recovery-and-vision]
    paths: [.github/workflows/implementation-hardening.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/run-recovery-and-vision'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.17
          python-version: '3.12'
      - name: Apply explicit recovery fix and security overrides
        run: |
          python3 - <<'PY'
          import json, textwrap
          from pathlib import Path
          p=Path('src/workflows.ts'); s=p.read_text()
          needle='    if (mode === "new" || mode === "reconstruct" || mode === "restart") sid = yield* io(() => createTarget(cdp!, session, j, mode !== "reconstruct", deadline));'
          addition='''
          if ((mode === "reconstruct" || mode === "restart") && before.tabRetained && before.browserId === session.browserId) {
            // Explicit recovery abandons this document. A crashed page can block
            // Playwright attachment to its replacement. Never retire user tabs.
            yield* io(async () => {
              const registry = path.join(host.home(), "targets", session.namespace, `${before.targetId}.json`);
              const owner = JSON.parse(await fs.promises.readFile(registry, "utf8"));
              if (owner.targetId !== before.targetId || owner.browserId !== session.browserId) throw new BrowserError({ code: "target", reason: "Cannot retire a tab without its matching ownership record." });
              const targets = await cdp!.send<{ targetInfos: { targetId: string }[] }>("Target.getTargets");
              if (targets.targetInfos.some(t => t.targetId === before.targetId)) {
                const result = await cdp!.send<{ success: boolean }>("Target.closeTarget", { targetId: before.targetId });
                if (!result.success) throw new BrowserError({ code: "target", reason: "The abandoned task tab could not be retired." });
              }
              j.append("closed", { targetId: before.targetId, reason: "explicit_recovery", mode });
              fs.rmSync(registry, { force: true });
            });
          }
          '''
          addition=textwrap.indent(textwrap.dedent(addition).lstrip(),'    ')
          assert s.count(needle)==1; p.write_text(s.replace(needle,addition+needle))
          p=Path('test/workflows.smoke.mjs'); s=p.read_text()
          old="  assert.equal(rendererResult.status, 'passed', JSON.stringify(rendererResult)); passed.push('real renderer crash and explicit reconstruction');"
          new="  assert.equal(rendererResult.status, 'passed', JSON.stringify(rendererResult));\n  const afterCrash = await Cdp.open(f.session);\n  assert.equal((await afterCrash.send('Target.getTargets')).targetInfos.some(t => t.targetId === renderer.targetId), false, 'explicit reconstruction retires its abandoned task tab');\n  await afterCrash.close(); passed.push('real renderer crash, owned-tab retirement, and explicit reconstruction');"
          assert old in s; p.write_text(s.replace(old,new))
          p=Path('package.json'); pkg=json.loads(p.read_text()); pkg['dependencies'].pop('ajv-formats',None)
          pkg['overrides']={'js-yaml':'4.3.2','sharp':'0.35.4','uuid':'11.1.1','puppeteer-core':'25.11.0'}
          p.write_text(json.dumps(pkg,indent=2)+'\n')
          p=Path('docs/fallback.md'); p.write_text(p.read_text()+'\nExplicit reconstruction or restart retires the abandoned owned task tab before opening its replacement. The original run evidence and failed attempt remain. It never retires unrelated tabs.\n')
          Path('.github/workflows/implementation-hardening.yml').unlink()
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Commit reviewed fixes to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/workflows.ts test/workflows.smoke.mjs docs/fallback.md package.json package-lock.json .github/workflows
          git commit -m 'fix: retire abandoned owned tabs during recovery and patch adapter dependencies'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/run-recovery-and-vision
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          uv sync --project worker --locked
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and unit tests
        if: always() && !cancelled()
        run: npm run check
      - name: Managed upstream Jev
        if: always() && !cancelled()
        run: uv run --project worker --no-sync python worker/tests/managed_smoke.py
      - name: Scoped adapter and native MCP images
        if: always() && !cancelled()
        run: timeout 90s node test/adapter.smoke.mjs
      - name: Public workflows and real crash recovery
        if: always() && !cancelled()
        run: timeout 180s node test/workflows.smoke.mjs
      - name: Actual Midscene with controlled provider
        if: always() && !cancelled()
        run: timeout 90s node test/vision.smoke.mjs
